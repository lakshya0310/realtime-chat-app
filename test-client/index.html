<!DOCTYPE html>
<html>

<head>
    <title>Socket.io Chat Test</title>

    <style>
        body {
            font-family: Arial;
            width: 700px;
            margin: 30px auto;
        }

        input,
        button {
            padding: 8px;
            margin: 5px;
        }

        #messages {
            border: 1px solid gray;
            height: 350px;
            overflow-y: auto;
            padding: 10px;
            margin-top: 15px;
        }

        .message {
            padding: 8px;
            margin: 5px 0;
            background: #f2f2f2;
            border-radius: 5px;
        }
    </style>

</head>

<body>

    <h2>Socket.io Chat Test</h2>

    <button id="loginBtn">Login Socket</button>

    <hr>

    <div>
        <input id="conversationId" placeholder="Conversation ID" size="40">
    </div>

    <div>
        <input id="receiverId" placeholder="Receiver ID" size="40">
    </div>

    <div>
        <input id="senderId" placeholder="Sender ID" size="40">
    </div>

    <div>
        <input id="message" placeholder="Type message..." size="50">

        <button id="sendBtn">
            Send
        </button>
    </div>

    <div id="messages"></div>

    <script src="http://localhost:5000/socket.io/socket.io.js"></script>

    <script>

        const socket = io("http://localhost:5000");

        socket.on("connect", () => {

            console.log("Connected");

        });

        document
            .getElementById("loginBtn")
            .onclick = () => {

                const token = prompt("Paste JWT");

                socket.emit("join", token);

            };

        socket.on("onlineUsers", (users) => {

            console.log(users);

        });

        document
            .getElementById("sendBtn")
            .onclick = () => {

                socket.emit("sendMessage", {

                    conversationId:
                        document.getElementById("conversationId").value,

                    senderId:
                        document.getElementById("senderId").value,

                    receiverId:
                        document.getElementById("receiverId").value,

                    text:
                        document.getElementById("message").value,

                });

            };

        socket.on("messageSent", (message) => {

            addMessage("Me: " + message.text);

        });

        socket.on("receiveMessage", (message) => {

            addMessage("Friend: " + message.text);

        });

        function addMessage(text) {

            const div = document.createElement("div");

            div.className = "message";

            div.innerHTML = text;

            document
                .getElementById("messages")
                .appendChild(div);

        }

    </script>

</body>

</html>
